<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Каталог десертів — Maya Cake</title>
  <meta name="description" content="Увесь асортимент Maya Cake: торти, макарон, бенто, тарти, еклери, тістечка, десерти в стаканчиках. Ціни, вага, склад і КБЖВ.">
  <!-- Прев'ю при пересиланні посилання (Telegram, Viber, Facebook): логотип Maya Cake -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Maya Cake">
  <meta property="og:locale" content="uk_UA">
  <meta property="og:title" content="Каталог десертів — Maya Cake">
  <meta property="og:description" content="Увесь асортимент Maya Cake: торти, макарон, бенто, тарти, еклери, тістечка, десерти в стаканчиках. Ціни, вага, склад і КБЖВ.">
  <meta property="og:url" content="https://alinabeliever.github.io/maya-cake/catalog.html">
  <meta property="og:image" content="https://alinabeliever.github.io/maya-cake/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Логотип Maya Cake">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#FBF6F2">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- шрифти вантажаться паралельно й не затримують показ сторінки -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css?v=20261104x">
</head>
<body data-page="catalog">
<main id="main">
  <section class="page-head">
    <div class="container">
      <h1 data-cat-title>Каталог</h1>
      <p class="lead muted" data-cat-lead>Замовте до 14:00 — привеземо завтра з 10:00 до 18:00.</p>
    </div>
  </section>

  <div class="cat-sticky">
    <div class="container">
      <nav class="chips hscroll" aria-label="Категорії" data-chips></nav>
    </div>
  </div>

  <section>
    <div class="container">
      <div class="filters">
        <div class="chips hscroll filters__toggles" role="group" aria-label="Фільтри" data-filters></div>
        <label class="filters__sort">Сортувати
          <select class="select" data-sort>
            <option value="popular">Популярні</option>
            <option value="asc">Ціна ↑</option>
            <option value="desc">Ціна ↓</option>
          </select>
        </label>
      </div>
      <p class="catalog-count" data-count aria-live="polite"></p>
      <div class="product-grid" data-grid></div>
      <div class="empty-state" data-empty hidden>
        <div class="ph-circle"><span>нічого</span></div>
        <h2>Нічого не знайшли</h2>
        <p class="muted">Спробуйте прибрати частину фільтрів.</p>
        <button class="btn btn--ghost" type="button" data-reset>Скинути фільтри</button>
      </div>
    </div>
  </section>
</main>

<script src="js/config.js?v=20261104x"></script>
<script src="js/main.js?v=20261104x"></script>
<script src="js/cart.js?v=20261104x"></script>
<script src="js/catalog.js?v=20261104x"></script>
</body>
</html>
